<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0c1422" />
  <meta name="description" content="دژ خاکستر — بازی استراتژی بقا موبایل" />
  <title>Ashen Citadel — دژ خاکستر</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="game-container">
    <div id="top-bar">
      <div class="resource" id="res-wood">🪵 <span>0</span></div>
      <div class="resource" id="res-stone">🪨 <span>0</span></div>
      <div class="resource" id="res-food">🍖 <span>0</span></div>
      <div class="resource" id="res-coal">🔥 <span>0</span></div>
      <div class="resource" id="res-iron">⚙️ <span>0</span></div>
      <div class="resource crystal" id="res-crystal">💎 <span>0</span></div>
    </div>
    <div id="heat-bar-container">
      <div id="heat-label">گرما</div>
      <div id="heat-bar"><div id="heat-fill"></div></div>
      <div id="heat-value">100%</div>
    </div>
    <div id="main-area">
      <canvas id="game-canvas" width="400" height="500"></canvas>
      <div id="building-panel" class="panel hidden">
        <h3 id="building-title">ساختمان</h3>
        <p id="building-desc"></p>
        <p id="building-level"></p>
        <p id="building-cost"></p>
        <button id="btn-upgrade" class="btn primary">ارتقاء</button>
        <button id="btn-close-panel" class="btn">بستن</button>
      </div>
    </div>
    <div id="bottom-bar">
      <button class="action-btn" id="btn-build" type="button">🏗️<span class="label">ساخت</span></button>
      <button class="action-btn" id="btn-heroes" type="button">⚔️<span class="label">قهرمان</span></button>
      <button class="action-btn" id="btn-defend" type="button">🛡️<span class="label">دفاع</span></button>
      <button class="action-btn" id="btn-map" type="button">🗺️<span class="label">مأموریت</span></button>
      <button class="action-btn" id="btn-alliance" type="button">🤝<span class="label">اتحاد</span></button>
    </div>
    <div id="notification" class="hidden"></div>
    <div id="tutorial-overlay" class="hidden">
      <div id="tutorial-box">
        <div id="tutorial-step">۱ / ۵</div>
        <p id="tutorial-text">متن آموزش</p>
        <div id="tutorial-actions">
          <button id="btn-tutorial-skip" class="btn" type="button">رد کردن</button>
          <button id="btn-tutorial-next" class="btn primary" type="button">بعدی</button>
        </div>
      </div>
    </div>
    <div id="mission-panel" class="panel hidden">
      <h3>مأموریت‌های روزانه</h3>
      <div id="mission-list"></div>
      <button id="btn-close-missions" class="btn" type="button">بستن</button>
    </div>
    <div id="hero-panel" class="panel hidden">
      <h3>قهرمانان دژ</h3>
      <div id="hero-list"></div>
      <button id="btn-close-heroes" class="btn" type="button">بستن</button>
    </div>
    <div id="defense-overlay" class="hidden">
      <div id="defense-ui">
        <h2>حمله به دژ!</h2>
        <p>دشمنان نزدیک می‌شوند...</p>
        <div id="wave-info">موج ۱</div>
        <canvas id="defense-canvas" width="360" height="400"></canvas>
        <button id="btn-start-defense" class="btn primary" type="button">شروع دفاع</button>
        <button id="btn-exit-defense" class="btn" type="button">بازگشت</button>
      </div>
    </div>
    <div id="start-screen">
      <div class="start-content">
        <h1>ASHEN CITADEL</h1>
        <h2>دژ خاکستر</h2>
        <p>جهان یخ زده است. تو آخرین امید مردمی...</p>
        <button id="btn-start-game" class="btn primary large" type="button">شروع بازی</button>
      </div>
    </div>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
